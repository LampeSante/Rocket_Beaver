[package]
name = "treasury-router-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
anchor-lang = "1.1.2"

[dependencies.treasury-router]
path = "../programs/treasury-router"

[[bin]]
name = "execution_release_limit"
path = "fuzz_targets/execution_release_limit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "waterfall_engine"
path = "fuzz_targets/waterfall_engine.rs"
test = false
doc = false
bench = false

[[bin]]
name = "adaptive_dam"
path = "fuzz_targets/adaptive_dam.rs"
test = false
doc = false
bench = false

[[bin]]
name = "treasury_accounting"
path = "fuzz_targets/treasury_accounting.rs"
test = false
doc = false
bench = false

# Keep fuzzing isolated from the production Cargo workspace.
[workspace]
