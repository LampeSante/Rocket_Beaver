[package]
name = "rbvr-oracle-adapter"
version = "0.1.0"
description = "Pyth verification adapter for the RBVR Treasury Router"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rbvr_oracle_adapter"

[features]
default = []
anchor-debug = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
]

[dependencies]
anchor-lang = "=1.1.2"
pyth-solana-receiver-sdk = "=2.0.0"
treasury-router = { path = "../../../programs/treasury-router", features = ["cpi"] }
