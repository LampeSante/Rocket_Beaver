[package]
name = "treasury-router"
version = "0.1.0"
description = "Rocket Beaver Beavernomics treasury router"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "treasury_router"

[features]
anchor-debug = []
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build"
]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = { version = "1.1.2", features = ["associated_token", "token"] }
